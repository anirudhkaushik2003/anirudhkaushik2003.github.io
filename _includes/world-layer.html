<!-- Living World Background Layer -->
<div id="world-layer" aria-hidden="true">
  <div id="world-sky"></div>
  <div id="world-clouds"></div>
  <div id="world-stars"></div>
  <!-- Ocean sits above beach (further from viewer) -->
  <div id="world-ocean">
    <div class="world-sun-reflection"></div>
    <div class="world-wave world-wave--1"></div>
    <div class="world-wave world-wave--2"></div>
    <div class="world-wave world-wave--3"></div>
  </div>
  <!-- Beach at the very bottom (closest to viewer) -->
  <div id="world-beach">
    <div class="world-wet-sand"></div>
    <div class="world-foam"></div>
  </div>
  <div id="world-sparkles"></div>
</div>
